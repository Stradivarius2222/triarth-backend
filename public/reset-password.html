<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Reset Password - PT Tritunggal Arthamakmur</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Gaya Tombol Bahasa Kustom (Pill Style) */
        .lang-pill-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #0366d6;
            background: transparent;
            padding: 6px 14px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: none;
            border: none;
        }
        .lang-pill-btn:hover {
            background-color: transparent;
            border-color: #0366d6;
        }
        .lang-pill-btn i {
            font-size: 1rem;
            color: #0366d6;
        }
    </style>
</head>
<body class="signup-page-body">

    <!-- Top Language Switcher Bar for Standalone Auth Page -->
    <div style="position: absolute; top: 20px; right: 30px; z-index: 10;">
        <button onclick="toggleLanguage()" class="lang-pill-btn" id="langDesktopBtn" title="Switch Language">
            <i class="fa-solid fa-globe"></i>
            <span id="langDesktopText">En</span>
        </button>
    </div>

    <main class="signup-main-container">
        <div class="signup-wrapper" style="grid-template-columns: 1fr; max-width: 500px;">
            <div class="signup-right-col" style="max-width: 100%;">
                <h1 class="signup-title" style="margin-bottom: 10px !important;" data-i18n="resetTitle">Reset Password</h1>
                <p style="color: #666; font-size: 1.05rem; margin-bottom: 25px;" data-i18n="resetSub">Masukkan password baru Anda.</p>

                <form action="/reset-password" method="POST">
                    <input type="hidden" name="token" id="tokenInput">

                    <div class="form-group-custom form-field-group" style="margin-bottom: 20px;">
                        <label for="new_password" data-i18n="labelNewPass">Password Baru</label>
                        <input type="password" id="new_password" name="new_password" class="signup-input" placeholder="Masukkan password baru" data-i18n-placeholder="placeholderNewPass" required>
                    </div>

                    <div class="form-group-custom form-field-group" style="margin-bottom: 25px;">
                        <label for="confirm_password" data-i18n="labelConfirmPass">Konfirmasi Password Baru</label>
                        <input type="password" id="confirm_password" name="confirm_password" class="signup-input" placeholder="Ulangi password baru" data-i18n-placeholder="placeholderConfirmPass" required>
                    </div>

                    <button type="submit" class="btn-submit-green" style="width: 100%;" data-i18n="submitBtn">Simpan Password Baru</button>
                </form>
            </div>
        </div>
    </main>

    <!-- SKRIP MULTI-LANGUAGE DICTIONARY -->
    <script>
 let translations = { en: {}, id: {} };

// Ambil data terjemahan secara dinamis dari database via API backend
function loadTranslations() {
    fetch('/api/translations')
        .then(res => res.json())
        .then(data => {
            translations = data;
            const savedLang = localStorage.getItem('tam_lang') || 'en';
            applyTranslations(savedLang);
        })
        .catch(err => console.error("Gagal memuat terjemahan:", err));
}

function switchLanguage(lang) {
    localStorage.setItem('tam_lang', lang);
    applyTranslations(lang);
}

function toggleLanguage() {
    const currentLang = localStorage.getItem('tam_lang') || 'en';
    const newLang = currentLang === 'en' ? 'id' : 'en';
    switchLanguage(newLang);
}

function applyTranslations(lang) {
    const t = translations[lang] || translations['en'] || {};
    
    const displayLangText = lang === 'en' ? 'En' : 'Id';
    const desktopTextEl = document.getElementById('langDesktopText');
    const mobileTextEl = document.getElementById('langMobileText');
    if (desktopTextEl) desktopTextEl.textContent = displayLangText;
    if (mobileTextEl) mobileTextEl.textContent = displayLangText;

    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) {
            el.innerHTML = t[key];
        }
    });

    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.getAttribute('data-i18n-placeholder');
        if (t[key]) {
            el.setAttribute('placeholder', t[key]);
        }
    });
}

document.addEventListener('DOMContentLoaded', () => {
    loadTranslations();
});
    </script>

    <script>
        // Ambil token dari URL query string (?token=xxx)
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (token) {
            document.getElementById('tokenInput').value = token;
        }
    </script>
</body>
</html>
